<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Social Task Hub — Admin</title>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <main class="max-w-6xl mx-auto p-4 md:p-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-black">Social Task Hub Admin</h1>
        <p class="text-xs text-slate-500">Secure Operations Console • Supabase Engine</p>
      </div>
      <button id="btnLogout" onclick="logoutAdmin()" class="hidden px-4 py-2 rounded-xl bg-white border text-xs font-bold shadow-sm hover:bg-slate-50">Logout</button>
    </div>

    <!-- Admin Sign In Panel -->
    <section id="loginPanel" class="max-w-md mx-auto bg-white rounded-2xl p-5 shadow">
      <h2 class="font-black mb-3">Admin Sign In</h2>
      <input id="email" type="email" placeholder="Admin email" class="w-full border rounded-xl p-3 mb-2 text-sm focus:outline-none focus:border-indigo-600">
      <input id="pass" type="password" placeholder="Password" class="w-full border rounded-xl p-3 mb-3 text-sm focus:outline-none focus:border-indigo-600">
      <button onclick="loginAdmin()" id="btnLogin" class="w-full bg-indigo-600 text-white rounded-xl p-3 font-black text-sm active:scale-95 transition">Sign In</button>
      <p id="loginMsg" class="text-xs text-rose-600 mt-3 font-medium"></p>
    </section>

    <!-- Main Dashboard Section -->
    <section id="app" class="hidden space-y-5">
      <!-- Counters Grid -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><b id="cUsers" class="text-lg">0</b><p class="text-xs text-slate-500 font-semibold">Users</p></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><b id="cTasks" class="text-lg">0</b><p class="text-xs text-slate-500 font-semibold">Active Tasks</p></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><b id="cProofs" class="text-lg text-amber-600">0</b><p class="text-xs text-slate-500 font-semibold">Pending Proofs</p></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><b id="cDeposits" class="text-lg text-emerald-600">0</b><p class="text-xs text-slate-500 font-semibold">Pending Deposits</p></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><b id="cWithdrawals" class="text-lg text-rose-600">0</b><p class="text-xs text-slate-500 font-semibold">Pending Withdrawals</p></div>
      </div>

      <!-- Action Queues Grid -->
      <div class="grid md:grid-cols-2 gap-5">
        <!-- Proofs -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-black text-sm">Proof Verification</h2>
            <button onclick="loadAll()" class="text-xs font-bold text-indigo-600 hover:underline">Refresh</button>
          </div>
          <div id="proofs" class="space-y-2 max-h-[520px] overflow-auto"></div>
        </section>

        <!-- Deposits -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <h2 class="font-black text-sm mb-3">Deposit Requests</h2>
          <div id="deposits" class="space-y-2 max-h-[520px] overflow-auto"></div>
        </section>

        <!-- Withdrawals -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <h2 class="font-black text-sm mb-3">Withdrawal Requests</h2>
          <div id="withdrawals" class="space-y-2 max-h-[520px] overflow-auto"></div>
        </section>

        <!-- KYC Verification -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <h2 class="font-black text-sm mb-3">KYC Verification</h2>
          <div id="kyc" class="space-y-2 max-h-[520px] overflow-auto"></div>
        </section>
      </div>

      <!-- User Wallet Balance Manual Override -->
      <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <h2 class="font-black text-sm mb-3">User Wallet & Role Control</h2>
        <div class="flex gap-2">
          <input id="userSearchInput" placeholder="User Email, Username or UUID" class="flex-1 border rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-600">
          <button onclick="loadUser()" class="px-5 rounded-xl bg-slate-900 text-white text-xs font-black active:scale-95 transition">Search User</button>
        </div>
        <div id="userBox" class="mt-3"></div>
      </section>
    </section>
  </main>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://yijjfsuiuhtfhzqasfjp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlpampmc3VpdWh0Zmh6cWFzZmpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MzYzODUsImV4cCI6MjEwNDIxMjM4NX0.ksHTXtTABkjKyaTQcjyrsHafxDYbQLk55IzyW2IZhtw';
    
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentAdmin = null;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    const empty = t => `<div class="text-xs text-slate-400 p-4 text-center border border-dashed rounded-xl">${t}</div>`;

    async function initAdminAuth() {
      const { data: { session } } = await sb.auth.getSession();
      await verifyAdminSession(session?.user || null);

      sb.auth.onAuthStateChange(async (_event, session) => {
        await verifyAdminSession(session?.user || null);
      });
    }

    async function verifyAdminSession(user) {
      const panel = document.getElementById('loginPanel');
      const app = document.getElementById('app');
      const btnLogout = document.getElementById('btnLogout');
      const msg = document.getElementById('loginMsg');

      if (!user) {
        currentAdmin = null;
        panel.classList.remove('hidden');
        app.classList.add('hidden');
        btnLogout.classList.add('hidden');
        return;
      }

      const { data: profile, error } = await sb
        .from('profiles')
        .select('role, full_name')
        .eq('id', user.id)
        .single();

      if (error || profile?.role !== 'admin') {
        msg.textContent = 'Access Denied: Account does not possess Admin privileges.';
        await sb.auth.signOut();
        panel.classList.remove('hidden');
        app.classList.add('hidden');
        btnLogout.classList.add('hidden');
        return;
      }

      currentAdmin = user;
      panel.classList.add('hidden');
      app.classList.remove('hidden');
      btnLogout.classList.remove('hidden');
      loadAll();
    }

    async function loginAdmin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('pass').value;
      const msg = document.getElementById('loginMsg');
      const btn = document.getElementById('btnLogin');

      if (!email || !password) {
        msg.textContent = 'Please provide both email and password.';
        return;
      }

      msg.textContent = 'Signing in…';
      btn.disabled = true;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        msg.textContent = 'Login failed: ' + error.message;
        btn.disabled = false;
        return;
      }

      btn.disabled = false;
    }

    async function logoutAdmin() {
      await sb.auth.signOut();
    }

    document.getElementById('pass').addEventListener('keydown', e => {
      if (e.key === 'Enter') loginAdmin();
    });

    async function loadAll() {
      try {
        const [usersRes, tasksRes, proofsRes, depositsRes, withdrawalsRes, kycRes] = await Promise.all([
          sb.from('profiles').select('id', { count: 'exact' }),
          sb.from('tasks').select('*').eq('status', 'active'),
          sb.from('proofs').select('*, tasks(title, reward_points)').eq('status', 'pending'),
          sb.from('transactions').select('*, profiles(username, full_name)').eq('type', 'deposit').eq('status', 'pending'),
          sb.from('transactions').select('*, profiles(username, full_name)').eq('type', 'withdrawal').eq('status', 'pending'),
          sb.from('kyc_records').select('*, profiles(username, full_name)').eq('status', 'pending')
        ]);

        document.getElementById('cUsers').textContent = usersRes.count || 0;
        document.getElementById('cTasks').textContent = tasksRes.data?.length || 0;
        document.getElementById('cProofs').textContent = proofsRes.data?.length || 0;
        document.getElementById('cDeposits').textContent = depositsRes.data?.length || 0;
        document.getElementById('cWithdrawals').textContent = withdrawalsRes.data?.length || 0;

        renderProofs(proofsRes.data || []);
        renderDeposits(depositsRes.data || []);
        renderWithdrawals(withdrawalsRes.data || []);
        renderKyc(kycRes.data || []);
      } catch (err) {
        alert('Data read error: ' + err.message);
      }
    }

    function renderProofs(items) {
      const container = document.getElementById('proofs');
      if (!items.length) { container.innerHTML = empty('No pending proofs'); return; }
      container.innerHTML = items.map(p => `
        <div class="border rounded-xl p-3 bg-slate-50 space-y-2">
          <div class="flex justify-between items-center">
            <b class="text-xs text-slate-800">${esc(p.tasks?.title || 'Task Submission')}</b>
            <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">+${p.tasks?.reward_points || 15} PTS</span>
          </div>
          <p class="text-[11px] text-slate-500">Worker Handle: <b class="text-slate-800">@${esc(p.worker_handle)}</b></p>
          ${p.screenshot_url ? `
            <a href="${esc(p.screenshot_url)}" target="_blank" rel="noopener noreferrer" class="block">
              <img src="${esc(p.screenshot_url)}" class="w-full max-h-48 object-contain rounded-xl border bg-white shadow-sm" loading="lazy">
            </a>` : ''}
          <div class="flex gap-2 pt-1">
            <button onclick="decideProof('${p.id}', '${p.task_id}', '${p.worker_id}', ${p.tasks?.reward_points || 15}, 'approved')" class="flex-1 bg-emerald-600 text-white rounded-lg py-2 text-xs font-bold active:scale-95 transition">Approve & Credit</button>
            <button onclick="decideProof('${p.id}', '${p.task_id}', '${p.worker_id}', 0, 'rejected')" class="flex-1 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg py-2 text-xs font-bold active:scale-95 transition">Reject</button>
          </div>
        </div>
      `).join('');
    }

    function renderDeposits(items) {
      const container = document.getElementById('deposits');
      if (!items.length) { container.innerHTML = empty('No pending deposits'); return; }
      container.innerHTML = items.map(d => `
        <div class="border rounded-xl p-3 bg-slate-50 space-y-1">
          <div class="flex justify-between">
            <b class="text-xs uppercase text-slate-900">${esc(d.gateway || 'Method')} • ৳${Number(d.amount_bdt || 0).toFixed(2)}</b>
            <span class="text-[10px] text-emerald-600 font-bold">+${d.points} PTS</span>
          </div>
          <p class="text-[10px] text-slate-500">User: <b>@${esc(d.profiles?.username || 'User')}</b> • TrxID: <span class="font-mono bg-white px-1.5 py-0.5 border rounded">${esc(d.trx_id || 'N/A')}</span></p>
          <div class="flex gap-2 mt-2">
            <button onclick="decideDeposit('${d.id}', '${d.user_id}', ${d.points}, 'completed')" class="flex-1 bg-emerald-600 text-white rounded-lg py-1.5 text-xs font-bold active:scale-95 transition">Approve Deposit</button>
            <button onclick="decideDeposit('${d.id}', '${d.user_id}', 0, 'rejected')" class="flex-1 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg py-1.5 text-xs font-bold active:scale-95 transition">Reject</button>
          </div>
        </div>
      `).join('');
    }

    function renderWithdrawals(items) {
      const container = document.getElementById('withdrawals');
      if (!items.length) { container.innerHTML = empty('No pending withdrawals'); return; }
      container.innerHTML = items.map(w => `
        <div class="border rounded-xl p-3 bg-slate-50 space-y-1">
          <div class="flex justify-between">
            <b class="text-xs uppercase text-slate-900">${esc(w.gateway || 'Method')} • ৳${Number(w.amount_bdt || 0).toFixed(2)}</b>
            <span class="text-[10px] text-rose-600 font-bold">-${w.points} PTS</span>
          </div>
          <p class="text-[10px] text-slate-500">User: <b>@${esc(w.profiles?.username || 'User')}</b></p>
          <div class="flex gap-2 mt-2">
            <button onclick="decideWithdrawal('${w.id}', '${w.user_id}', ${w.points}, 'completed')" class="flex-1 bg-emerald-600 text-white rounded-lg py-1.5 text-xs font-bold active:scale-95 transition">Mark Paid</button>
            <button onclick="decideWithdrawal('${w.id}', '${w.user_id}', ${w.points}, 'rejected')" class="flex-1 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg py-1.5 text-xs font-bold active:scale-95 transition">Reject & Refund</button>
          </div>
        </div>
      `).join('');
    }

    function renderKyc(items) {
      const container = document.getElementById('kyc');
      if (!items.length) { container.innerHTML = empty('No pending KYC submissions'); return; }
      container.innerHTML = items.map(k => `
        <div class="border rounded-xl p-3 bg-slate-50 space-y-2">
          <div class="flex justify-between">
            <b class="text-xs">${esc(k.profiles?.full_name || 'User')} • ${esc(k.id_type?.toUpperCase())}</b>
            <span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full font-bold">@${esc(k.profiles?.username)}</span>
          </div>
          <p class="text-[10px] text-slate-500 font-mono">Doc No: ${esc(k.id_number)}</p>
          ${k.front_image ? `
            <a href="${esc(k.front_image)}" target="_blank" class="text-[10px] text-indigo-600 font-bold underline block">View ID Document Image ↗</a>
          ` : ''}
          <div class="flex gap-2 mt-2">
            <button onclick="decideKyc('${k.id}', '${k.user_id}', 'verified')" class="flex-1 bg-emerald-600 text-white rounded-lg py-1.5 text-xs font-bold active:scale-95 transition">Verify ID</button>
            <button onclick="decideKyc('${k.id}', '${k.user_id}', 'rejected')" class="flex-1 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg py-1.5 text-xs font-bold active:scale-95 transition">Reject</button>
          </div>
        </div>
      `).join('');
    }

    async function decideProof(proofId, taskId, workerId, rewardPoints, status) {
      const { error: pErr } = await sb.from('proofs').update({ status }).eq('id', proofId);
      if (pErr) return alert('Update failed: ' + pErr.message);

      if (status === 'approved') {
        const { data: t } = await sb.from('tasks').select('completed_count').eq('id', taskId).single();
        if (t) await sb.from('tasks').update({ completed_count: (t.completed_count || 0) + 1 }).eq('id', taskId);

        const { data: prof } = await sb.from('profiles').select('points').eq('id', workerId).single();
        if (prof) await sb.from('profiles').update({ points: (prof.points || 0) + rewardPoints }).eq('id', workerId);

        await sb.from('transactions').insert([{
          user_id: workerId,
          type: 'reward',
          points: rewardPoints,
          status: 'completed'
        }]);
      }
      loadAll();
    }

    async function decideDeposit(txId, userId, points, status) {
      const { error } = await sb.from('transactions').update({ status }).eq('id', txId);
      if (error) return alert(error.message);

      if (status === 'completed') {
        const { data: prof } = await sb.from('profiles').select('points').eq('id', userId).single();
        if (prof) await sb.from('profiles').update({ points: (prof.points || 0) + points }).eq('id', userId);
      }
      loadAll();
    }

    async function decideWithdrawal(txId, userId, points, status) {
      const { error } = await sb.from('transactions').update({ status }).eq('id', txId);
      if (error) return alert(error.message);

      if (status === 'rejected') {
        const { data: prof } = await sb.from('profiles').select('points').eq('id', userId).single();
        if (prof) await sb.from('profiles').update({ points: (prof.points || 0) + points }).eq('id', userId);
      }
      loadAll();
    }

    async function decideKyc(kycId, userId, status) {
      const { error } = await sb.from('kyc_records').update({ status }).eq('id', kycId);
      if (error) return alert(error.message);

      if (status === 'verified') {
        await sb.from('profiles').update({ is_verified: true }).eq('id', userId);
      }
      loadAll();
    }

    async function loadUser() {
      const q = document.getElementById('userSearchInput').value.trim();
      const container = document.getElementById('userBox');
      if (!q) return;

      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(q);
      let query = sb.from('profiles').select('*');
      if (isUuid) query = query.eq('id', q);
      else query = query.or(`username.ilike.%${q}%,full_name.ilike.%${q}%`);

      const { data, error } = await query.limit(1).single();
      if (error || !data) { container.innerHTML = empty('User not found'); return; }

      container.innerHTML = `
        <div class="border rounded-xl p-4 bg-slate-50 space-y-3">
          <div class="flex justify-between items-center">
            <div>
              <b class="text-sm text-slate-900">${esc(data.full_name)} (@${esc(data.username)})</b>
              <p class="text-[10px] text-slate-400 font-mono">UUID: ${esc(data.id)}</p>
            </div>
            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${data.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-slate-200 text-slate-700'}">${data.role?.toUpperCase()}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-600">Points:</span>
            <input id="targetUserPts" type="number" value="${data.points || 0}" class="border rounded-xl px-3 py-1.5 text-xs font-black w-32 focus:outline-none focus:border-indigo-600">
            <button onclick="updateUserBalance('${data.id}')" class="px-4 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold active:scale-95 transition">Update Balance</button>
            <button onclick="toggleUserRole('${data.id}', '${data.role}')" class="px-3 py-1.5 bg-white border border-slate-200 text-slate-700 rounded-xl text-xs font-bold active:scale-95 transition">Toggle Role</button>
          </div>
        </div>
      `;
    }

    async function updateUserBalance(userId) {
      const pts = parseInt(document.getElementById('targetUserPts').value, 10);
      if (isNaN(pts) || pts < 0) return alert('Invalid points');
      const { error } = await sb.from('profiles').update({ points: pts }).eq('id', userId);
      if (error) alert('Update error: ' + error.message);
      else { alert('Balance updated.'); loadUser(); }
    }

    async function toggleUserRole(userId, currentRole) {
      const newRole = currentRole === 'admin' ? 'user' : 'admin';
      const { error } = await sb.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) alert('Role update error: ' + error.message);
      else { alert(`User role updated to ${newRole}`); loadUser(); }
    }

    document.addEventListener('DOMContentLoaded', initAdminAuth);
  </script>
</body>
</html>
