name: Apply KYC button fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Automated KYC button patch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.html')
          if not p.exists():
              raise SystemExit('admin.html not found')
          s = p.read_text(encoding='utf-8')

          new_decide = '''async function decideKyc(kycId, userId, status) {
            try {
              const isApproved = status === 'verified';
              const finalKycStatus = isApproved ? 'approved' : 'rejected';

              // 1. Update kyc_records table
              const { error: kycErr } = await sb
                .from('kyc_records')
                .update({ status: finalKycStatus })
                .eq('id', kycId);

              if (kycErr) throw kycErr;

              // 2. If approved, update profile to verified
              if (isApproved && userId) {
                const { error: profErr } = await sb
                  .from('profiles')
                  .update({ is_verified: true })
                  .eq('id', userId);

                if (profErr) console.warn('Profile verify warning:', profErr);
              }

              alert(isApproved ? 'KYC successfully verified!' : 'KYC submission rejected.');
              loadAll();
            } catch (err) {
              alert('Error updating KYC: ' + (err.message || err));
              console.error(err);
            }
          }
          '''

          pattern = r"async function decideKyc\(kycId, userId, status\) \{.*?\n    \}\n\n    async function loadUser\(\)"
          s2, n = re.subn(pattern, new_decide + "\n    async function loadUser()", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('decideKyc function pattern not found')
          s = s2

          # Ensure the KYC action buttons are explicit non-submit buttons and invoke the handler directly.
          s, n1 = re.subn(
              r'<button onclick="decideKyc\(\'\\$\{k\.id\}\', \'\\$\{k\.user_id\}\', \'verified\'\)"',
              r'<button type="button" onclick="decideKyc(\'${k.id}\', \'${k.user_id}\', \'verified\')"',
              s,
              count=1
          )
          s, n2 = re.subn(
              r'<button onclick="decideKyc\(\'\\$\{k\.id\}\', \'\\$\{k\.user_id\}\', \'rejected\'\)"',
              r'<button type="button" onclick="decideKyc(\'${k.id}\', \'${k.user_id}\', \'rejected\')"',
              s,
              count=1
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'KYC button patterns not found: verify={n1}, reject={n2}')

          p.write_text(s, encoding='utf-8')
          print('KYC patch applied successfully')
          PY

      - name: Verify patch
        run: |
          grep -n "async function decideKyc" admin.html
          grep -n "KYC successfully verified!" admin.html
          grep -n "type=\"button\" onclick=\"decideKyc" admin.html

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --check
          git commit -m "Automated KYC button patch" || echo "No changes to commit"
          git push